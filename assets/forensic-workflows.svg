<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="468" viewBox="0 0 1200 468" role="img" aria-labelledby="title desc">
<title id="title">Forensic software workflow studies: DriveSeal and AI Scanner Darkly</title>
<desc id="desc">Illustrative architecture flow, not an application screenshot. DriveSeal follows selection, physical identity checks, preparation or delivery, and independent verification. AI Scanner Darkly follows local image selection, provenance and structure inspection, examiner review, and reporting.</desc>
<rect width="1200" height="468" rx="22" fill="#0b1522"/>
<rect x="24" y="24" width="1152" height="420" rx="16" fill="#111f30" stroke="#31465a"/>
<text x="56" y="74" fill="#e9f2f6" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700">Engineering for trustworthy evidence</text>
<text x="57" y="103" fill="#b6c8d4" font-family="Arial,Helvetica,sans-serif" font-size="14">Two owner-directed forensic software initiatives · Private development · No real case data</text>
<line x1="56" y1="123" x2="1144" y2="123" stroke="#354a5c"/>
<rect x="54" y="143" width="534" height="231" rx="12" fill="#14283b" stroke="#4f748b"/>
